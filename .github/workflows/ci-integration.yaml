name: Auto-run test/lint/format

on: [push]

jobs:
  domjudge_integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker
      uses: docker/setup-docker-action@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies # TODO: put it in requirements.txt or pyproject.yaml
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml pytest requests

    - name: Run pytest
      run: |
        python -m pytest tests/test_domjudge_import.py --run-integration --integration-backend=host
